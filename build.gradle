plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "$mod_id-$minecraft_version"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name "Ametrin Studios Maven"
        url "https://github.com/Ametrin-Studios/maven/raw/main/"
    }
    maven {
        url uri(rootProject.file("../../maven"))
    }
}

dependencies {
    implementation "com.ametrinstudios:ametrin-${minecraft_version}:${ametrin_version}"
    interfaceInjectionData "com.ametrinstudios:ametrin-${minecraft_version}:${ametrin_version}"
    implementation "com.ametrin:ametrin_structures-${minecraft_version}:${ametrin_structures_version}"
    compileOnly "com.ametrinstudios:block_variants:${minecraft_version}-${bv_version}"
    localRuntime "com.ametrinstudios:block_variants:${minecraft_version}-${bv_version}"

    localRuntime "curse.maven:xaeros-world-map-317780:9067277"
    localRuntime "curse.maven:xaeros-minimap-263420:9067173"
//    localRuntime "curse.maven:biomes-o-plenty-220318:6384687"
//    localRuntime "curse.maven:terrablender-neoforge-940057:6055021"
//    localRuntime "curse.maven:glitchcore-955399:6054289"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version               : minecraft_version,
            minecraft_version_range         : minecraft_version_range,
            neo_version                     : neo_version,
            neo_version_range               : neo_version_range,
            loader_version_range            : loader_version_range,

            ametrin_version                 : ametrin_version,
            ametrin_version_range           : ametrin_version_range,
            ametrin_structures_version      : ametrin_structures_version,
            ametrin_structures_version_range: ametrin_structures_version_range,
            bv_version                      : bv_version,
            bv_version_range                : bv_version_range,

            mod_id                          : mod_id,
            mod_name                        : mod_name,
            mod_license                     : mod_license,
            mod_version                     : mod_version,
            mod_authors                     : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// run manually on release
tasks.register("updateDataPackTemplate") {
    group = "datagen"
    var generated = file("src/generated/resources/data/${mod_id}")
    var template = file("DATA-PACK-TEMPLATE/data/${mod_id}")
    doLast {
        var copyAll = { File source, File target ->
            if (!source.exists()) return
            source.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                var out = target.toPath().resolve(source.toPath().relativize(file.toPath())).toFile()
                out.parentFile.mkdirs()
                out.bytes = file.bytes
            }
        }
        for (path in ["ametrin_structures/spawner_profile", "trial_spawner", "worldgen/structure_set"]) {
            new File(template, path).deleteDir()
            copyAll(new File(generated, path), new File(template, path))
        }

        var biomeTags = new File(generated, "tags/worldgen/biome")
        var biomeTagTemplates = new File(template, "tags/worldgen/biome")
        biomeTagTemplates.deleteDir()
        biomeTags.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            var path = biomeTags.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            if (!path.startsWith("has_structure") && !path.startsWith("no_structures")) return
            var out = new File(biomeTagTemplates, path)
            out.parentFile.mkdirs()
            out.text = file.text.contains('"remove"')
                    ? '{\n  "values": [\n\n  ],\n  "remove": [\n\n  ]\n}'
                    : '{\n  "values": [\n\n  ]\n}'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
